<body>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="callsign-row">
      <div class="toad-avatar-wrap">
        <svg class="toad-avatar" width="46" height="46" viewBox="0 0 64 64">
          <circle cx="32" cy="34" r="22" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="44" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="3.5" fill="#050b10"/>
          <circle cx="44" cy="16" r="3.5" fill="#050b10"/>
          <ellipse cx="24" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <ellipse cx="40" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>

          <circle cx="40" cy="30" r="1.4" fill="#39ff8f"/>
          <path d="M22 42 Q32 48 42 42" stroke="#050b10" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>

      <div class="nav-links">
        <a href="https://projects.slippylabs.com/" class="logout-link">← Archive</a>

    <h1>STOPWATCH &amp; TIMER</h1>
    <p class="subtitle">Time something up with the stopwatch, or count something down with the timer.</p>

    <div class="filter-bar" id="mode-tabs">
      <button class="hud-tab active" data-mode="stopwatch">Stopwatch</button>
      <button class="hud-tab" data-mode="timer">Timer</button>
    </div>

    <div id="stopwatch-panel">
      <div class="calc-display" id="sw-display" style="text-align:center;">0:00:00.00</div>

      <div class="tool-controls" style="justify-content:center;">
        <button class="tool-btn" id="start-pause-btn">Start</button>
        <button class="tool-btn ghost" id="lap-btn" disabled>Lap</button>
        <button class="tool-btn ghost" id="reset-btn" disabled>Reset</button>
      </div>

      <ol class="match-list" id="lap-list"></ol>
    </div>

    <div id="timer-panel" class="hidden">
      <div class="tip-quick-row" id="timer-presets">
        <button class="tip-quick-btn" data-seconds="60">1 min</button>
        <button class="tip-quick-btn" data-seconds="300">5 min</button>
        <button class="tip-quick-btn" data-seconds="600">10 min</button>
        <button class="tip-quick-btn" data-seconds="1500">25 min</button>
      </div>

      <div class="tool-dim-row">
        <div class="tool-field-row">
          <label class="tool-field-label" for="timer-minutes">Minutes</label>
          <input class="tool-number-input" id="timer-minutes" type="number" min="0" max="999" value="5">
        </div>
        <div class="tool-field-row">
          <label class="tool-field-label" for="timer-seconds">Seconds</label>
          <input class="tool-number-input" id="timer-seconds" type="number" min="0" max="59" value="0">
        </div>
      </div>

      <div class="calc-display" id="timer-display" style="text-align:center;">0:05:00</div>
      <p class="strength-label" id="timer-status" style="text-align:center;">Ready.</p>

      <div class="tool-controls" style="justify-content:center;">
        <button class="tool-btn" id="timer-start-pause-btn">Start</button>
        <button class="tool-btn ghost" id="timer-reset-btn">Reset</button>
      </div>
    </div>

    <div class="comm-window">
      <div class="comm-portrait">
        <svg width="36" height="36" viewBox="0 0 64 64">
          <circle cx="32" cy="34" r="22" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="44" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="3.5" fill="#050b10"/>
          <circle cx="44" cy="16" r="3.5" fill="#050b10"/>
          <ellipse cx="24" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <ellipse cx="40" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <circle cx="24" cy="30" r="1.4" fill="#39ff8f"/>
          <circle cx="40" cy="30" r="1.4" fill="#39ff8f"/>

      </div>

    <a href="https://projects.slippylabs.com/" class="hud-btn">← Back to Archive</a>
  </div>
</main>

<script>
const display = document.getElementById('sw-display');
const startPauseBtn = document.getElementById('start-pause-btn');
const lapBtn = document.getElementById('lap-btn');
const resetBtn = document.getElementById('reset-btn');
const lapList = document.getElementById('lap-list');

let running = false;
let startTime = 0;
let elapsed = 0;
let intervalId = null;
let laps = [];

function formatTime(ms) {
  const totalCentis = Math.floor(ms / 10);
  const centis = totalCentis % 100;
  const totalSeconds = Math.floor(totalCentis / 100);
  const seconds = totalSeconds % 60;
  const totalMinutes = Math.floor(totalSeconds / 60);
  const minutes = totalMinutes % 60;
  const hours = Math.floor(totalMinutes / 60);
  const pad = n => String(n).padStart(2, '0');
  return `${hours}:${pad(minutes)}:${pad(seconds)}.${pad(centis)}`;
}

function currentElapsed() {
  return elapsed + (running ? Date.now() - startTime : 0);
}

function tick() {
  display.textContent = formatTime(currentElapsed());
}

function renderLaps() {
  lapList.innerHTML = laps.map((lap, i) => {
    const num = laps.length - i;
    return `<li><span class="match-index">Lap ${num}</span>${formatTime(lap.split)} <span style="color:var(--text-dim);">(total ${formatTime(lap.total)})</span></li>`;
  }).join('');
}

startPauseBtn.addEventListener('click', () => {
  if (running) {
    elapsed = currentElapsed();
    running = false;
    clearInterval(intervalId);
    startPauseBtn.textContent = 'Resume';
    lapBtn.disabled = true;
  } else {
    startTime = Date.now();
    running = true;
    intervalId = setInterval(tick, 10);
    startPauseBtn.textContent = 'Pause';
    lapBtn.disabled = false;
    resetBtn.disabled = false;
  }
});

lapBtn.addEventListener('click', () => {
  const total = currentElapsed();
  const prevTotal = laps.length ? laps[0].total : 0;
  laps.unshift({ total, split: total - prevTotal });
  renderLaps();
});

resetBtn.addEventListener('click', () => {
  running = false;
  clearInterval(intervalId);
  elapsed = 0;
  laps = [];
  startPauseBtn.textContent = 'Start';
  lapBtn.disabled = true;
  resetBtn.disabled = true;
  renderLaps();
  tick();
});

tick();

// ---------- Mode tabs ----------
const modeTabs = document.getElementById('mode-tabs');
const stopwatchPanel = document.getElementById('stopwatch-panel');
const timerPanel = document.getElementById('timer-panel');

modeTabs.addEventListener('click', (e) => {
  const btn = e.target.closest('.hud-tab');
  if (!btn) return;
  modeTabs.querySelectorAll('.hud-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const mode = btn.dataset.mode;
  stopwatchPanel.classList.toggle('hidden', mode !== 'stopwatch');
  timerPanel.classList.toggle('hidden', mode !== 'timer');
});

// ---------- Countdown timer ----------
const timerDisplay = document.getElementById('timer-display');
const timerStatus = document.getElementById('timer-status');
const timerStartPauseBtn = document.getElementById('timer-start-pause-btn');
const timerResetBtn = document.getElementById('timer-reset-btn');
const timerMinutesInput = document.getElementById('timer-minutes');
const timerSecondsInput = document.getElementById('timer-seconds');
const timerPresets = document.getElementById('timer-presets');

let timerRunning = false;
let timerTarget = 0;
let timerRemaining = 0;
let timerIntervalId = null;
let timerHasStarted = false;

function formatCountdown(ms) {
  const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
  const seconds = totalSeconds % 60;
  const totalMinutes = Math.floor(totalSeconds / 60);
  const minutes = totalMinutes % 60;
  const hours = Math.floor(totalMinutes / 60);
  const pad = n => String(n).padStart(2, '0');
  return `${hours}:${pad(minutes)}:${pad(seconds)}`;
}

function inputDurationMs() {
  const mins = Math.max(0, Number(timerMinutesInput.value) || 0);
  const secs = Math.max(0, Math.min(59, Number(timerSecondsInput.value) || 0));
  return (mins * 60 + secs) * 1000;
}

function renderTimerDisplay(ms) {
  timerDisplay.textContent = formatCountdown(ms);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
    osc.onended = () => ctx.close();
  } catch (err) { /* audio unavailable — ignore */ }
}

function timerTick() {
  timerRemaining = timerTarget - Date.now();
  if (timerRemaining <= 0) {
    timerRemaining = 0;
    renderTimerDisplay(0);
    clearInterval(timerIntervalId);
    timerRunning = false;
    timerStartPauseBtn.textContent = 'Start';
    timerStartPauseBtn.disabled = true;
    timerStatus.textContent = "⏰ Time's up!";
    timerDisplay.classList.add('timer-alert');
    beep();
    setTimeout(beep, 350);
    setTimeout(beep, 700);
    return;
  }
  renderTimerDisplay(timerRemaining);
}

timerStartPauseBtn.addEventListener('click', () => {
  if (timerRunning) {
    timerRunning = false;
    clearInterval(timerIntervalId);
    timerStartPauseBtn.textContent = 'Resume';
    timerStatus.textContent = 'Paused.';
    return;
  }

  timerDisplay.classList.remove('timer-alert');
  if (!timerHasStarted) {
    timerRemaining = inputDurationMs();
    if (timerRemaining <= 0) { timerStatus.textContent = 'Set a duration above 0 first.'; return; }
    timerHasStarted = true;
    timerMinutesInput.disabled = true;
    timerSecondsInput.disabled = true;
  }
  timerTarget = Date.now() + timerRemaining;
  timerRunning = true;
  timerIntervalId = setInterval(timerTick, 200);
  timerStartPauseBtn.textContent = 'Pause';
  timerStartPauseBtn.disabled = false;
  timerStatus.textContent = 'Counting down…';
});

timerResetBtn.addEventListener('click', () => {
  timerRunning = false;
  timerHasStarted = false;
  clearInterval(timerIntervalId);
  timerMinutesInput.disabled = false;
  timerSecondsInput.disabled = false;
  timerStartPauseBtn.textContent = 'Start';
  timerStartPauseBtn.disabled = false;
  timerDisplay.classList.remove('timer-alert');
  timerStatus.textContent = 'Ready.';
  renderTimerDisplay(inputDurationMs());
});

timerPresets.addEventListener('click', (e) => {
  const btn = e.target.closest('.tip-quick-btn');
  if (!btn || timerHasStarted) return;
  timerPresets.querySelectorAll('.tip-quick-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const secs = Number(btn.dataset.seconds);
  timerMinutesInput.value = Math.floor(secs / 60);
  timerSecondsInput.value = secs % 60;
  renderTimerDisplay(inputDurationMs());
});

[timerMinutesInput, timerSecondsInput].forEach(input => {
  input.addEventListener('input', () => {
    if (timerHasStarted) return;
    timerPresets.querySelectorAll('.tip-quick-btn').forEach(b => b.classList.remove('active'));
    renderTimerDisplay(inputDurationMs());
  });
});

renderTimerDisplay(inputDurationMs());
</script>
</body>
